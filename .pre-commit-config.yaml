# Hooks below run at commit time unless they declare their own `stages`.
# This keeps the fast commit-stage hooks out of the slower pre-push gate.
default_stages: [pre-commit]

repos:
  # Language-agnostic baseline.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: check-case-conflict
      - id: check-symlinks

  # Secret scanner.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # GitHub Actions linter.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # GitHub Actions security scanner. actionlint checks syntax; zizmor checks
  # for workflow vulnerabilities such as credential persistence and cache
  # poisoning, which actionlint does not look for.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        files: ^(build\.py|tests/)  # appModules/ keeps NVDA's tab-indentation convention

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        files: ^appModules/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
      - id: mypy
        args: [--config-file, pyproject.toml]
        files: ^appModules/discord/

  # Blocking pre-push gate: the full CI-equivalent suite.
  # Install with: pre-commit install --hook-type pre-push
  - repo: local
    hooks:
      - id: local-ci
        name: local CI (ruff, mypy, pytest, bandit, pip-audit, osv-scanner, trivy)
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check.ps1
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        verbose: true
